[project]
name = "funcraft"
version = "0.0.2"
description = "funcraft"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "牛哥", email = "farfarfun@qq.com" }]
dependencies = [
    "mcpi",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["funcraft"]

[dependency-groups]
dev = ["pytest>=7.0"]
