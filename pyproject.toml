[project]
name = "funcraft"
version = "0.0.3"
description = "Minecraft Pi 版编程接口封装：基于 mcpi 连接游戏，提供方块读写、区域批量建造、告示牌等 API，并内置墙/线/河流等建筑构件"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "牛哥", email = "farfarfun@qq.com" }]
dependencies = [
    "mcpi>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/funcraft"]

[dependency-groups]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
# 只收集 tests/ 下的用例，避免 pytest 默认的 `*_test.py` 匹配规则把仓库里
# 其他位置的脚本当成测试收集进来。
testpaths = ["tests"]
